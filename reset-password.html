<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — Caday Badminton</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="desktop.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js" defer></script>
  </head>
  <body>
    <header class="admin-header"><a class="brand" href="/"><img class="brand-logo" src="logo.svg" alt=""><span>CADAY<span class="brand-light">BADMINTON</span></span></a></header>
    <main class="admin-main">
      <section class="admin-login">
        <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT SECURITY</div>
        <h1>Choose a new<br><span>password.</span></h1>
        <form id="resetPasswordForm">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
          <button class="button button-dark" type="submit">Update password <span>→</span></button>
        </form>
        <p id="resetMessage" role="status"></p>
        <a class="underlined-link" href="/">Return to the shop <span>↗</span></a>
      </section>
    </main>
  </body>
</html>
